<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080b16"><link rel="manifest" href="./manifest.webmanifest"><title>GM iPhone Solo Pro</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 30%,#26325e,#080b16 70%);color:#f4f6ff;font-family:-apple-system,BlinkMacSystemFont,sans-serif;min-height:100dvh;display:flex;flex-direction:column;align-items:center;padding:24px}h1{font-size:24px;margin:10px}p{color:#b7c0dc;text-align:center;max-width:390px}.scene{height:390px;width:min(95vw,380px);perspective:850px;display:grid;place-items:center;touch-action:none}.phone{width:215px;height:345px;border:7px solid #51566c;border-radius:35px;background:#000;position:relative;transform-style:preserve-3d;transform:rotateY(var(--ry,0deg)) rotateX(var(--rx,0deg));transition:transform .12s ease-out;box-shadow:0 24px 60px #0009,0 0 30px #778aff44;overflow:hidden}.screen{position:absolute;inset:4px;border-radius:25px;background:linear-gradient(135deg,#f77cbd,#7159e8 45%,#1337a0);background-size:cover;background-position:center}.island{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:#050509;width:76px;height:22px;border-radius:20px}.hinge{position:absolute;left:50%;top:0;height:100%;width:3px;background:#ffffff66;transform:translateX(-50%);opacity:var(--hinge,0)}.panel{width:min(100%,430px);background:#ffffff12;border:1px solid #ffffff2b;border-radius:22px;padding:18px;backdrop-filter:blur(16px)}button,.upload{display:inline-block;border:0;border-radius:12px;padding:12px 16px;background:#7d85ff;color:#fff;font-weight:650;margin:5px;cursor:pointer}input[type=range]{width:100%}label{display:block;margin:12px 0 4px}small{color:#aeb8da}#status{font-size:13px;color:#b7c0dc}footer{font-size:12px;color:#929cb9;margin:22px;text-align:center}</style></head><body><h1>GM iPhone Solo Pro</h1><p>Interactive 3D phone illusion • Move or drag to animate</p><div class="scene" id="scene"><div class="phone" id="phone"><div class="screen" id="screen"></div><div class="hinge"></div><div class="island"></div></div></div><div class="panel"><button id="motion">Enable Motion</button><button id="reset">Reset</button><button id="fold">Fold Effect</button><label>Motion sensitivity <output id="sensVal">1.0</output></label><input id="sensitivity" type="range" min="0.2" max="2.5" value="1" step="0.1"><label>Animation smoothing <output id="smoothVal">0.12</output></label><input id="smoothing" type="range" min="0.04" max="0.45" value="0.12" step="0.01"><label class="upload">Choose wallpaper<input id="wallpaper" type="file" accept="image/*" hidden></label><p id="status" aria-live="polite">Drag the phone or enable motion sensing.</p></div><footer>Browser-based visual simulation; your physical iPhone does not fold. Motion permission requires HTTPS and a user gesture.</footer><script>const phone=document.querySelector('#phone'),scene=document.querySelector('#scene'),status=document.querySelector('#status');let rx=0,ry=0,tx=0,ty=0,drag=false,fold=false;const sens=document.querySelector('#sensitivity'),smooth=document.querySelector('#smoothing');function animate(){const a=+smooth.value;rx+=(tx-rx)*a;ry+=(ty-ry)*a;phone.style.setProperty('--rx',rx+'deg');phone.style.setProperty('--ry',ry+'deg');requestAnimationFrame(animate)}animate();scene.addEventListener('pointerdown',e=>{drag=true;scene.setPointerCapture(e.pointerId)});scene.addEventListener('pointermove',e=>{if(!drag)return;const r=scene.getBoundingClientRect();ty=Math.max(-65,Math.min(65,(e.clientX-r.left-r.width/2)/r.width*130));tx=Math.max(-45,Math.min(45,-(e.clientY-r.top-r.height/2)/r.height*90))});scene.addEventListener('pointerup',()=>drag=false);document.querySelector('#motion').onclick=async()=>{try{if(typeof DeviceOrientationEvent==='undefined')throw Error('Motion sensor unavailable');if(typeof DeviceOrientationEvent.requestPermission==='function'){const result=await DeviceOrientationEvent.requestPermission();if(result!=='granted')throw Error('Permission denied')}window.addEventListener('deviceorientation',e=>{if(drag)return;tx=Math.max(-45,Math.min(45,(e.beta||0)*+sens.value*.7));ty=Math.max(-65,Math.min(65,(e.gamma||0)*+sens.value*1.3))});status.textContent='Motion enabled. Tilt your iPhone.'}catch(e){status.textContent=e.message+' — drag to animate instead.'}};document.querySelector('#reset').onclick=()=>{tx=0;ty=0};document.querySelector('#fold').onclick=()=>{fold=!fold;phone.style.setProperty('--hinge',fold?'.9':'0');phone.style.scale=fold?'.86 1':'1';status.textContent=fold?'Fold-style visual overlay enabled.':'Fold-style overlay disabled.'};sens.oninput=()=>document.querySelector('#sensVal').textContent=(+sens.value).toFixed(1);smooth.oninput=()=>document.querySelector('#smoothVal').textContent=(+smooth.value).toFixed(2);document.querySelector('#wallpaper').onchange=e=>{const f=e.target.files[0];if(!f)return;document.querySelector('#screen').style.backgroundImage='url("'+URL.createObjectURL(f)+'")';status.textContent='Wallpaper loaded locally.'};if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});</script></body></html>
